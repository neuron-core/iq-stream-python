# The repository's scripts. Each package has its own settings in its pyproject.toml.
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[lint.isort]
# ci_matrix.py runs on the CI runner's Python (3.12); servers.py on any from 3.10.
extra-standard-library = ["tomllib"]
