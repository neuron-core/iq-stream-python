name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of it before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The server the integration tests run against. scripts/servers.py starts it twice, once with default settings
  # and once with short timeouts; the tests that restart a server start a container of their own from it.
  IQ_STREAM_TEST_IMAGE: ghcr.io/neuron-core/iq-stream:1

jobs:
  # Which packages to test, on which Pythons: every packages/*/pyproject.toml, on the versions its classifiers name.
  # A new package needs no change here.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.matrix.outputs.unit }}
      integration: ${{ steps.matrix.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        run: python3 scripts/ci_matrix.py >> "$GITHUB_OUTPUT"

  # Lint, types, unit tests and the build, for each package on each Python it supports.
  check:
    name: ${{ matrix.package }} on Python ${{ matrix.python }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.unit) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          working-directory: packages/${{ matrix.package }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.package }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src
      - run: uv run pytest tests/unit
      - run: uv build

  # Each package against two real IQ-Stream servers, on its lowest and its highest Python.
  integration:
    name: ${{ matrix.package }} integration on Python ${{ matrix.python }}
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.integration) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          working-directory: packages/${{ matrix.package }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.package }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the server image
        run: |
          docker pull "$IQ_STREAM_TEST_IMAGE" || {
            echo "::error::Cannot pull $IQ_STREAM_TEST_IMAGE. Give this repository read access to the package (its settings on GitHub, 'Manage Actions access'), or make the image public."
            exit 1
          }
      - run: python3 scripts/servers.py start
      - run: uv sync --locked
        working-directory: packages/${{ matrix.package }}
      - run: uv run pytest tests/integration
        working-directory: packages/${{ matrix.package }}
      - if: always()
        run: python3 scripts/servers.py stop
