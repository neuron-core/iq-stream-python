[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iq-stream"
version = "0.1.0"
description = "Python client for the IQ-Stream server: publish an agent's answer to browsers over Server-Sent Events"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Neuron Core" }]
keywords = ["sse", "server-sent-events", "streaming", "agents", "llm", "iq-stream"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/neuron-core/iq-stream-python"
Source = "https://github.com/neuron-core/iq-stream-python/tree/main/packages/iq-stream"
Issues = "https://github.com/neuron-core/iq-stream-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff",
    "pyright",
    "uvloop>=0.21 ; sys_platform != 'win32'",
]

# The lowest versions of the dependencies CI runs the unit tests against (scripts/ci_matrix.py).
[tool.iq-stream]
floor = ["httpx==0.27.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/iq_stream"]

# The tests need the repository (its servers and scripts), and the lockfile is for development: neither ships.
[tool.hatch.build.targets.sdist]
only-include = ["src/iq_stream", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
