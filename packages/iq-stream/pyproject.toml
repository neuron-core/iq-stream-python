[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iq-stream"
version = "0.1.0"
description = "Python client for the IQ-Stream server: publish an agent's answer to browsers over Server-Sent Events"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff", "pyright"]

[tool.hatch.build.targets.wheel]
packages = ["src/iq_stream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
